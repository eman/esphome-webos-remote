# Infrared only: an IR LED (through a transistor) on GPIO7. Works with any ESP32 that has an RMT peripheral.
esphome:
  name: lg-ir-remote
  friendly_name: LG TV IR Remote

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

packages:
  webos_remote:
    url: https://github.com/eman/esphome-webos-remote
    ref: v0.1.0
    files:
      - packages/ir.yaml
      - packages/ir_buttons.yaml
