# Generated by scripts/gen_buttons.py from scripts/keys.py; edit those, not this file.
# One Home Assistant button per LG key, sent over infrared (needs packages/ir.yaml).
# With the Bluetooth remote as well, use packages/bluetooth_buttons.yaml + packages/bluetooth_ir.yaml
# instead: those send over Bluetooth and fall back to infrared.
button:
