# Generated by scripts/gen_buttons.py from scripts/keys.py; edit those, not this file.
# Links the Bluetooth remote (packages/bluetooth.yaml) to the infrared one (packages/ir.yaml): IR fallback
# while the TV isn't connected, the IR pairing code for 'Pair with TV', and universal control (the TV's
# set-top box control, sent as IR). Adds the keys that only exist over infrared.
lg_magic_remote:
  ir_remote_id: lg_ir

button:
  - platform: template
    name: Universal control status
    icon: mdi:remote
    entity_category: diagnostic
    on_press:
      - lambda: "id(lg_bt).uei_status();"
  - platform: template
    name: "HDMI 1"
    icon: mdi:hdmi-port
    on_press:
      - lg_magic_remote.key:
          id: lg_bt
          key: "hdmi1"
  - platform: template
    name: "HDMI 2"
    icon: mdi:hdmi-port
    on_press:
      - lg_magic_remote.key:
          id: lg_bt
          key: "hdmi2"
  - platform: template
    name: "HDMI 3"
    icon: mdi:hdmi-port
    on_press:
      - lg_magic_remote.key:
          id: lg_bt
          key: "hdmi3"
  - platform: template
    name: "HDMI 4"
    icon: mdi:hdmi-port
    on_press:
      - lg_magic_remote.key:
          id: lg_bt
          key: "hdmi4"
  - platform: template
    name: "SimpLink"
    icon: mdi:link-variant
    on_press:
      - lg_magic_remote.key:
          id: lg_bt
          key: "simplink"
