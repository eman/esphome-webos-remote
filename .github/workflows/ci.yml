name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files are up to date
        run: |
          python3 scripts/gen_buttons.py
          python3 scripts/gen_compile_tests.py
          git diff --exit-code
      - name: Key tables
        run: python3 tests/check_keys.py
      - name: Scrub check
        run: python3 scripts/scrub_check.py
      - name: Ruff
        run: pipx run ruff check .
      - name: ZipIR decoder host test
        run: tests/zipir/run.sh
      - name: mSBC encoder host test
        run: tests/msbc/run.sh

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - ir-only-esp32c6
          - ir-only-esp32
          - bluetooth-only-esp32c6
          - bluetooth-ir-esp32c6
          - bluetooth-ir-esp32s3
          - capture-esp32c6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.config }}-${{ hashFiles('tests/compile/*.yaml') }}
          restore-keys: platformio-
      - name: Install ESPHome
        run: pip install "esphome==2026.11.0"
      - name: Validate
        working-directory: tests/compile
        run: esphome config ${{ matrix.config }}.yaml > /dev/null
      - name: Compile
        working-directory: tests/compile
        run: esphome compile ${{ matrix.config }}.yaml
