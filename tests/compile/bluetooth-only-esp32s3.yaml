# Generated by scripts/gen_compile_tests.py from examples/bluetooth-only.yaml.
# Bluetooth only: the ESP32 as the TV's Magic Remote, no extra hardware. Pairing needs the IR pairing code sent
# once by any LG IR blaster (docs/pairing.md). Needs an ESP32-C3, C5, C6, H2 or S3.
esphome:
  name: lg-magic-remote-esp32s3
  friendly_name: LG TV Remote

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

substitutions:
  webos_remote_source: ../../components

packages:
  bluetooth: !include ../../packages/bluetooth.yaml
