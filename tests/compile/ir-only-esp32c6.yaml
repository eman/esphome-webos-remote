# Generated by scripts/gen_compile_tests.py from examples/ir-only.yaml.
# Infrared only: an IR LED (through a transistor) on GPIO7. Works with any ESP32 that has an RMT peripheral.
esphome:
  name: lg-ir-remote-esp32c6
  friendly_name: LG TV IR Remote

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

substitutions:
  webos_remote_source: ../../components

packages:
  ir: !include ../../packages/ir.yaml
  ir_buttons: !include ../../packages/ir_buttons.yaml
