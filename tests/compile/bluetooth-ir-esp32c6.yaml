# Generated by scripts/gen_compile_tests.py from examples/bluetooth-ir.yaml.
# Everything: Bluetooth Magic Remote with IR fallback, pairing over IR, universal control, and voice from Home
# Assistant TTS. IR LED on GPIO7. Needs an ESP32-C3, C5, C6, H2 or S3.
esphome:
  name: lg-magic-remote-esp32c6
  friendly_name: LG TV Remote

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      # HTTPS media for voice next to Bluetooth and Wi-Fi: the static 16 kB TLS buffers don't fit.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: y
      CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN: y
      CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN: "4096"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

substitutions:
  webos_remote_source: ../../components

packages:
  ir: !include ../../packages/ir.yaml
  bluetooth: !include ../../packages/bluetooth.yaml
  bluetooth_buttons: !include ../../packages/bluetooth_buttons.yaml
  bluetooth_ir: !include ../../packages/bluetooth_ir.yaml
  voice: !include ../../packages/voice.yaml
