# Generated by scripts/gen_compile_tests.py from examples/capture.yaml.
# Capture mode, for porting to other TVs and remotes: the ESP32 plays the TV for a genuine Magic Remote and logs its
# advertisement, GATT table, replies and key/motion reports (docs/porting.md). Turn the TV off first, so it can't
# grab the remote, then call the HA action capture with what: start.
esphome:
  name: lg-remote-capture-esp32c6

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

substitutions:
  webos_remote_source: ../../components

packages:
  bluetooth_base: !include ../../packages/bluetooth_base.yaml
  debug: !include ../../packages/debug.yaml

lg_magic_remote:
  advertise_on_boot: false
  debug:
    capture: true
    serial_commands: true
